# oas-auth-service — deployment scaffolding (single source of truth).
# Internal-only BY DESIGN: ClusterIP, no built-in API key, normally NOT routed
# through Kong/nginx. Redis-only (token denylist) — no Postgres/ES. Depends on the
# internal Keycloak on the DB host.
# !! TEMP/UAT: temporarily exposed through Kong for UAT integration — see the auth:
#    block below and kong/kong.decK.yaml. REVERT to strictly private before prod. !!
service:
  name: oas-auth-service
  namespace: app
  container_port: 8080

app_repo:
  url: https://github.com/Open-Agri-Stack/OAS-Auth-Service.git
  branch: main

image:
  ecr_repository_name: oas-auth-service
  ecr_region: ap-northeast-1
  tag: latest

health:
  liveness_path: /actuator/health/liveness
  readiness_path: /actuator/health/readiness

openapi:
  docs_path: /v3/api-docs
  base_url_in_cluster: http://oas-auth-service.app.svc.cluster.local:8080

# !! TEMPORARY — UAT ONLY — REVERT BEFORE PROD !!  (documentation; Kong config lives
# in kong/kong.decK.yaml). Exposed through Kong for UAT integration, gated solely by
# the existing role keys in kong/.env (strategy: reuse the user/admin/superadmin keys
# already used for the catalogue services — no new consumer). REVERT: remove the
# oas-auth-service block from kong/kong.decK.yaml + re-sync, then delete this auth:
# block and restore the "internal-only" header comment above.
auth:
  kong_consumer: existing-role-keys   # reuses user/admin/superadmin from kong/.env (no new consumer)
  api_key_header: apikey
  api_key: ""                         # intentionally blank — no new shared UAT key (Option A)

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { cpu: 500m, memory: 1Gi }

# Non-secret runtime env. Redis = shared oas-redis; Keycloak = internal db-host:8081.
# KEYCLOAK_ISSUER host must match Keycloak's KC_HOSTNAME (the "issuer trap").
env:
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  SPRING_REDIS_HOST: "10.0.10.10"
  SPRING_REDIS_PORT: "6379"
  KEYCLOAK_BASE_URL: "http://10.0.10.10:8081"
  KEYCLOAK_ISSUER: "http://10.0.10.10:8081/realms/OAS"
  KEYCLOAK_REALM: "OAS"
  KEYCLOAK_CLIENT_ID: "oas-auth-service"
  # Credential verification ON. auth_token_create now takes {username, password}, asks the
  # user-catalogue's /user/v1/verify, and issues a token only for the userId it returns.
  # BREAKING for callers still sending {userId} — they get 400. Fails closed: if the catalogue
  # is unreachable, logins 503 rather than falling back to trusting the caller.
  CATALOGUE_VALIDATE_ENABLED: "true"
  # In-cluster, so the password never leaves the cluster and no Kong API key is involved.
  CATALOGUE_BASE_URL: "http://org-user-notification-services.app.svc.cluster.local:8080"

# Secret-injection strategy for the Jenkins pipeline. `provider: keycloak` -> the
# pipeline builds a Secret with just KEYCLOAK_CLIENT_SECRET from the named Jenkins
# credential (no DB/ES). Absent => 'db-es' (the catalogue default).
secrets:
  secret_name: oas-auth-service-secrets
  provider: keycloak
  client_secret_cred_id: keycloak-client-secret

helm:
  release_name: oas-auth-service
  chart_path: kubernetes/helm/oas-catalogue
  values_file: values-oas-auth-service.yaml
