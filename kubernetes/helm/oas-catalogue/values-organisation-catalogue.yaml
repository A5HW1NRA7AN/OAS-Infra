# values-organisation-catalogue.yaml — per-service overlay for organisation-catalogue.
# Derived from services/organisation-catalogue.config.yaml. Passed to
# `helm upgrade` with `-f` on top of the shared values.yaml. Regenerate via the
# helm-chart-scaffolding skill — do not hand-edit.

# Sets the deployed resource name to `organisation-catalogue` (matches the Kong
# upstream URL organisation-catalogue.app.svc.cluster.local).
fullnameOverride: organisation-catalogue

secretName: organisation-catalogue-secrets

# Data services live on the dedicated DB host (fixed private IP = terraform
# var db_host_private_ip). Keep this in sync with terraform/environments/oas-uat.
env:
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  SPRING_DATASOURCE_URL: jdbc:postgresql://10.0.10.10:5432/oas_db
  ELASTICSEARCH_HOST: "10.0.10.10"
  ELASTICSEARCH_PORT: "9200"
  SPRING_REDIS_HOST: "10.0.10.10"
  SPRING_REDIS_PORT: "6379"
