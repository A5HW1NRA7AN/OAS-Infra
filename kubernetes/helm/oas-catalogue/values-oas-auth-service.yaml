# Per-service overlay for oas-auth-service (passed with -f over the shared values.yaml).
# Sets the deployed resource name (= in-cluster DNS host) + the k8s Secret name + env.
fullnameOverride: oas-auth-service
secretName: oas-auth-service-secrets

env:
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  SPRING_REDIS_HOST: "10.0.10.10"
  SPRING_REDIS_PORT: "6379"
  KEYCLOAK_BASE_URL: "http://10.0.10.10:8081"
  KEYCLOAK_ISSUER: "http://10.0.10.10:8081/realms/OAS"
  KEYCLOAK_REALM: "OAS"
  KEYCLOAK_CLIENT_ID: "oas-auth-service"
  # Credential verification ON: auth_token_create takes {email, password} and asks the
  # catalogue. Fails closed — an unreachable catalogue means 503, never a token.
  CATALOGUE_VALIDATE_ENABLED: "true"
  CATALOGUE_BASE_URL: "http://org-user-notification-services.app.svc.cluster.local:8080"
  # Raised from the app default of 900s to match the realm's ssoSessionMaxLifespan (36000s).
  # auth_token_refresh means a session can live 10h on 5-min access tokens, and this TTL governs
  # BOTH the Redis session index and the revoke denylists. At 900s a revoked user's block would
  # expire while their session was still refreshable, and the session index would drop sids that
  # revokeUser still needs to enumerate. Keep >= ssoSessionMaxLifespan in the OAS realm.
  KEYCLOAK_DENYLIST_SID_TTL_SECONDS: "36000"
