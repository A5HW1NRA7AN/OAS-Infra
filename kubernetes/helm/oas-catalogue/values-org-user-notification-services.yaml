# values-org-user-notification-services.yaml — per-service overlay for org-user-notification-services.
# Derived from services/org-user-notification-services.config.yaml. Passed to
# `helm upgrade` with `-f` on top of the shared values.yaml. Regenerate via the
# helm-chart-scaffolding skill — do not hand-edit.

# Sets the deployed resource name to `org-user-notification-services` (matches the Kong
# upstream URL org-user-notification-services.app.svc.cluster.local).
fullnameOverride: org-user-notification-services

secretName: org-user-notification-services-secrets

# Data services live on the dedicated DB host (fixed private IP = terraform
# var db_host_private_ip). Keep this in sync with terraform/environments/oas-uat.
env:
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  SPRING_DATASOURCE_URL: jdbc:postgresql://10.0.10.10:5432/oas_db
  ELASTICSEARCH_HOST: "10.0.10.10"
  ELASTICSEARCH_PORT: "9200"
  SPRING_REDIS_HOST: "10.0.10.10"
  SPRING_REDIS_PORT: "6379"
  # auth-service in-cluster, so the call bypasses Kong and needs no API key.
  AUTH_SERVICE_URL: http://oas-auth-service.app.svc.cluster.local:8080
