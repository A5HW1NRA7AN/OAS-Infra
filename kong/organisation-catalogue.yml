_format_version: "3.0"
services:
  - name: organisation-catalogue
    url: http://organisation-catalogue.app.svc.cluster.local:8080
    routes:
      - name: organisation-catalogue-all
        paths:
          - /audit
          - /org
        strip_path: false
    plugins:
      - name: key-auth
        config:
          key_names:
            - apikey
consumers:
  - username: oas-uat-consumer
    keyauth_credentials:
      - key: testapi-123
