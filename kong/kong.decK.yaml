# Kong declarative config — DB-backed (synced with decK, OSS).
#
# RBAC model (see docs): apps have NO built-in auth, so Kong is the sole
# enforcement point. Access is split by URL PATH, not HTTP method, because
# `search` is a POST yet is a read operation.
#
#   read route  : ~/<prefixes>/v1/(read|search).*        -> acl allow [readers, editors]
#   write route : ~/<prefixes>/v1/(create|draft|add|
#                   approve|review|toggle|update|
#                   delete|import|loadFromPrimary).*        -> acl allow [editors]
#
#   consumer  user       -> group readers            (read + search)
#   consumer  admin       -> groups readers, editors  (full CRUD + search)
#   consumer  superadmin  -> groups readers, editors  (+ key rotation, operational)
#
# API keys are NOT committed — decK resolves them from the environment at sync
# time (kong/scripts/deck-sync.sh exports them from db-host/.env or Jenkins).
# rate-limiting is provisioned but disabled (enabled: false) — flip on later.

_format_version: "3.0"

services:
  - name: org-user-notification-services
    url: http://org-user-notification-services.app.svc.cluster.local:8080
    routes:
      - name: org-user-notification-services-read
        strip_path: false
        paths:
          - "~/(org|user|catalogueassignment|catalogue|departmenttype)/v1/(read|search).*"
        plugins:
          - name: acl
            config:
              allow: ["readers", "editors"]
      - name: org-user-notification-services-write
        strip_path: false
        paths:
          - "~/(org|user|catalogueassignment|catalogue|departmenttype)/v1/(create|draft|add|approve|review|toggle|update|delete|import|loadFromPrimary).*"
        plugins:
          - name: acl
            config:
              allow: ["editors"]
      # Notification endpoints use plain REST paths (/api/notifications,
      # /api/notification-templates), not the catalogue /(prefix)/v1/(verb)
      # convention, so they are split by HTTP method rather than URL verb.
      - name: org-user-notification-services-notif-read
        strip_path: false
        methods: ["GET"]
        paths:
          - "~/api/(notifications|notification-templates).*"
        plugins:
          - name: acl
            config:
              allow: ["readers", "editors"]
      - name: org-user-notification-services-notif-write
        strip_path: false
        methods: ["POST", "PUT", "DELETE"]
        paths:
          - "~/api/(notifications|notification-templates).*"
        plugins:
          - name: acl
            config:
              allow: ["editors"]
    plugins:
      - name: key-auth
        config:
          key_names: ["apikey"]
      - name: rate-limiting
        enabled: false
        config:
          minute: 600
          policy: local

  - name: agri-catalogue-service
    url: http://catalogue-service.app.svc.cluster.local:8080
    routes:
      - name: agri-catalogue-read
        strip_path: false
        paths:
          - "~/(audit|seed|croptype|cropcategory|cropvariety|livestock|livestockbreed|livestockcategory|season|soil|extensionequipment|pesticide|insecticide|fertilizer|marketplace|locationmapper|locationobject)/v1/(read|search).*"
        plugins:
          - name: acl
            config:
              allow: ["readers", "editors"]
      - name: agri-catalogue-write
        strip_path: false
        paths:
          - "~/(audit|seed|croptype|cropcategory|cropvariety|livestock|livestockbreed|livestockcategory|season|soil|extensionequipment|pesticide|insecticide|fertilizer|marketplace|locationmapper|locationobject)/v1/(create|draft|add|approve|review|toggle|update|delete|import|loadFromPrimary).*"
        plugins:
          - name: acl
            config:
              allow: ["editors"]
    plugins:
      - name: key-auth
        config:
          key_names: ["apikey"]
      - name: rate-limiting
        enabled: false
        config:
          minute: 600
          policy: local

  # ==========================================================================
  # TEMPORARY 
  # Exposes the INTERNAL oas-auth-service through Kong so UAT integration partners
  # can call it directly instead of tunnelling through the bastion.
  # auth_token_create IS credential-checked (CATALOGUE_VALIDATE_ENABLED=true: the
  # user-catalogue verifies {email, password}, fail-closed). The auth_user_* endpoints
  # are NOT -- they authenticate no caller, and auth_user_create upserts org_id/
  # entity_type, so a role-key holder can rewrite or delete another identity.
  # Accepted FOR UAT ONLY; key-auth below is the only gate and it reuses the existing
  # kong/.env role keys (no new consumer).
  # REVERT: delete this whole block (this comment -> service -> its 2 routes ->
  # its plugins) and re-run kong/scripts/deck-sync.sh. Declarative sync prunes
  # it and /auth/v1/* 404s again. See README "Security notes (UAT)".
  # ==========================================================================
  - name: oas-auth-service                       # TEMP/UAT -- revert before prod
    url: http://oas-auth-service.app.svc.cluster.local:8080
    routes:
      - name: oas-auth-service-catchall          # TEMP/UAT: /auth/v1/* (verbs don't fit the catalogue regex)
        strip_path: false
        paths:
          - "~/auth/v1/.*"
        plugins:
          - name: acl
            config:
              allow: ["readers", "editors"]
      - name: oas-auth-service-health            # TEMP/UAT: lets the Postman Health Check pass via the hosted URL
        strip_path: false
        paths:
          - "~/actuator/health/.*"
        plugins:
          - name: acl
            config:
              allow: ["readers", "editors"]
    plugins:
      - name: key-auth
        config:
          key_names: ["apikey"]
      - name: rate-limiting
        enabled: false
        config:
          minute: 600
          policy: local

consumers:
  - username: user
    keyauth_credentials:
      - key: '${{ env "DECK_OAS_USER_API_KEY" }}'
    acls:
      - group: readers

  - username: admin
    keyauth_credentials:
      - key: '${{ env "DECK_OAS_ADMIN_API_KEY" }}'
    acls:
      - group: readers
      - group: editors

  - username: superadmin
    keyauth_credentials:
      - key: '${{ env "DECK_OAS_SUPERADMIN_API_KEY" }}'
    acls:
      - group: readers
      - group: editors
