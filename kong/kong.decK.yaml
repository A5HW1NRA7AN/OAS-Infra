# Kong declarative config — DB-backed (synced with decK, OSS).
#
# RBAC model (see docs): apps have NO built-in auth, so Kong is the sole
# enforcement point. Access is split by URL PATH, not HTTP method, because
# `search` is a POST yet is a read operation.
#
#   read route  : ~/<prefixes>/v1/(read|search).*        -> acl allow [readers, editors]
#   write route : ~/<prefixes>/v1/(create|draft|add|
#                   approve|review|toggle|update|
#                   delete|import).*                       -> acl allow [editors]
#
#   consumer  user       -> group readers            (read + search)
#   consumer  admin       -> groups readers, editors  (full CRUD + search)
#   consumer  superadmin  -> groups readers, editors  (+ key rotation, operational)
#
# API keys are NOT committed — decK resolves them from the environment at sync
# time (kong/scripts/deck-sync.sh exports them from db-host/.env or Jenkins).
# rate-limiting is provisioned but disabled (enabled: false) — flip on later.

_format_version: "3.0"

services:
  - name: org-user-notification-services
    url: http://org-user-notification-services.app.svc.cluster.local:8080
    routes:
      - name: org-user-notification-services-read
        strip_path: false
        paths:
          - "~/(org|user)/v1/(read|search).*"
        plugins:
          - name: acl
            config:
              allow: ["readers", "editors"]
      - name: org-user-notification-services-write
        strip_path: false
        paths:
          - "~/(org|user)/v1/(create|draft|add|approve|review|toggle|update|delete|import).*"
        plugins:
          - name: acl
            config:
              allow: ["editors"]
    plugins:
      - name: key-auth
        config:
          key_names: ["apikey"]
      - name: rate-limiting
        enabled: false
        config:
          minute: 600
          policy: local

  - name: agri-catalogue-service
    url: http://catalogue-service.app.svc.cluster.local:8080
    routes:
      - name: agri-catalogue-read
        strip_path: false
        paths:
          - "~/(audit|seed|croptype|cropcategory|cropvariety|livestock|livestockbreed|season|soil|extensionequipment|pesticide|insecticide|fertilizer|marketplace|locationmapper|locationobject)/v1/(read|search).*"
        plugins:
          - name: acl
            config:
              allow: ["readers", "editors"]
      - name: agri-catalogue-write
        strip_path: false
        paths:
          - "~/(audit|seed|croptype|cropcategory|cropvariety|livestock|livestockbreed|season|soil|extensionequipment|pesticide|insecticide|fertilizer|marketplace|locationmapper|locationobject)/v1/(create|draft|add|approve|review|toggle|update|delete|import).*"
        plugins:
          - name: acl
            config:
              allow: ["editors"]
    plugins:
      - name: key-auth
        config:
          key_names: ["apikey"]
      - name: rate-limiting
        enabled: false
        config:
          minute: 600
          policy: local

  # ==========================================================================
  # !! TEMPORARY -- UAT ONLY -- REVERT BEFORE PROD !!
  # Exposes the INTERNAL oas-auth-service through Kong for UAT integration.
  # This service does NOT authenticate its callers: auth_token_create mints a
  # token for ANY userId with no credential check. Public exposure is an
  # auth-bypass risk, accepted FOR UAT ONLY. key-auth below is the ONLY gate --
  # it reuses the existing kong/.env role keys (no new consumer).
  # REVERT: delete this whole block (this comment -> service -> its 2 routes ->
  # its plugins) and re-run kong/scripts/deck-sync.sh. Declarative sync prunes
  # it and /auth/v1/* 404s again. See README "Security notes (UAT)".
  # ==========================================================================
  - name: oas-auth-service                       # TEMP/UAT -- revert before prod
    url: http://oas-auth-service.app.svc.cluster.local:8080
    routes:
      - name: oas-auth-service-catchall          # TEMP/UAT: /auth/v1/* (verbs don't fit the catalogue regex)
        strip_path: false
        paths:
          - "~/auth/v1/.*"
        plugins:
          - name: acl
            config:
              allow: ["readers", "editors"]
      - name: oas-auth-service-health            # TEMP/UAT: lets the Postman Health Check pass via the hosted URL
        strip_path: false
        paths:
          - "~/actuator/health/.*"
        plugins:
          - name: acl
            config:
              allow: ["readers", "editors"]
    plugins:
      - name: key-auth
        config:
          key_names: ["apikey"]
      - name: rate-limiting
        enabled: false
        config:
          minute: 600
          policy: local

consumers:
  - username: user
    keyauth_credentials:
      - key: '${{ env "DECK_OAS_USER_API_KEY" }}'
    acls:
      - group: readers

  - username: admin
    keyauth_credentials:
      - key: '${{ env "DECK_OAS_ADMIN_API_KEY" }}'
    acls:
      - group: readers
      - group: editors

  - username: superadmin
    keyauth_credentials:
      - key: '${{ env "DECK_OAS_SUPERADMIN_API_KEY" }}'
    acls:
      - group: readers
      - group: editors
