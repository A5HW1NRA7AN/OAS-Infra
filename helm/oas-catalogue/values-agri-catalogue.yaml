# values-agri-catalogue.yaml — per-service overlay for agri-catalogue-service.
# Derived from services/agri-catalogue.config.yaml. Passed to `helm upgrade`
# with `-f` on top of the shared values.yaml. Regenerate via the
# helm-chart-scaffolding skill — do not hand-edit.

# Keeps the deployed resource name stable at `catalogue-service` (matches the
# Kong upstream URL and the pre-existing release).
fullnameOverride: catalogue-service

secretName: catalogue-service-secrets

env:
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-postgresql.data.svc.cluster.local:5432/oas_db
  ELASTICSEARCH_HOST: elasticsearch.data.svc.cluster.local
  ELASTICSEARCH_PORT: "9200"
  SPRING_REDIS_HOST: redis-master.data.svc.cluster.local
  SPRING_REDIS_PORT: "6379"
